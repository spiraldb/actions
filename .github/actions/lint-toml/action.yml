name: Lint TOML
description: "Linter to enforce TOML style and conventions"

runs:
  using: "composite"
  steps:
    - name: Install taplo
      uses: taiki-e/install-action@4575ae687efd0e2c78240087f26013fb2484987f # v2
      with:
        tool: taplo

    - name: Run taplo-cli
      shell: bash
      run: taplo fmt --check
