name: "Setup Python UV"
description: "Toolchain setup for Python UV"

inputs:
  sync:
    description: "Sync the project"
    required: false
    default: "true"
  prune-cache:
    description: "Prune cache before save"
    required: false
    default: ${{ github.ref == 'refs/heads/develop' }}
  version:
    description: "Version of UV"
    required: false
    default: ""
  python-version:
    description: "Version of Python"
    required: false
    default: ""
  save-cache:
    description: "Whether to save the cache after the run"
    default: ${{ github.ref == 'refs/heads/develop' }}
  cache-suffix:
    description: "Suffix for the cache key"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: ${{ inputs.version }}
        enable-cache: true
        prune-cache: ${{ inputs.prune-cache }}
        save-cache: ${{ inputs.save-cache }}
        cache-suffix: ${{ inputs.cache-suffix }}
    - name: "Setup up Python"
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install the project
      if: ${{ inputs.sync == 'true' }}
      shell: bash
      run: uv sync --all-extras --dev -v
      env:
        MATURIN_PEP517_USE_BASE_PYTHON: "true"
        # Keep this constant to avoid pyo3 invalidating itself
        PYO3_ENVIRONMENT_SIGNATURE: "cpython3"

    - name: Export Path
      shell: bash
      run: echo "PATH=$PATH" >> $GITHUB_ENV
