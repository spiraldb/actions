name: Lint TOML
description: "Linter to enforce TOML style and conventions"

runs:
  using: "composite"
  steps:
    - name: Install taplo
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
      with:
        tool: taplo

    - name: Run taplo-cli
      shell: bash
      run: taplo fmt --check
