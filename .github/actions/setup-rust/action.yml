name: Setup Rust
description: Sets up Rust and relevant toolchain components

inputs:
  toolchain:
    description: >-
      Toolchain to install, e.g. "1.91.0" or "stable". Defaults to the channel in
      rust-toolchain.toml, which is only read when this is empty.
    required: false
    default: ""
  components:
    description: Comma-separated list of components to be additionally installed for a new toolchain
    required: false
    default: clippy, rustfmt
  targets:
    description: Comma-separated list of targets to be additionally installed for a new toolchain
    required: false
    default: ""
  sccache:
    description: "Enable sccache"
    required: false
    default: "true"
  shared_key:
    description: "Shared key for caching across jobs"
    required: false
    default: "shared" # To allow reuse across jobs
  timestamp:
    description: "Timestamp cache with cargo sweep"
  dependency_cache:
    description: "Enable dependency caching"
    required: false
    default: "true"

outputs:
  deps-cache-hit:
    description: "True if the dependencies were cached, false otherwise"
    value: ${{ steps.rust-dep-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Rust Version
      id: rust-version
      shell: bash
      env:
        # Passed through the environment rather than interpolated into the script, so that the
        # value cannot be expanded as shell.
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        version="$TOOLCHAIN"
        if [ -z "$version" ]; then
          version=$(cat rust-toolchain.toml | grep channel | awk -F'"' '{print $2}')
        else
          # rustup honours rust-toolchain.toml over whichever toolchain we install here, so an
          # explicit override has to be pinned for every later cargo invocation in the job.
          # Only set when overridden, to leave the toolchain-file path behaving exactly as before.
          echo "RUSTUP_TOOLCHAIN=$version" >> $GITHUB_ENV
        fi
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Rust Toolchain
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      if: steps.rustup-cache.outputs.cache-hit != 'true'
      with:
        toolchain: "${{ steps.rust-version.outputs.version }}"
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Rust Dependency Cache
      id: rust-dep-cache
      if: ${{ inputs.dependency_cache == 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        save-if: ${{ github.ref_name == 'develop' }}
        shared-key: ${{ inputs.shared_key }}

    - name: Rust Compile Cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      if: ${{ inputs.sccache == 'true' }}

    - name: Rust Compile Cache Config
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        ${{ inputs.sccache == 'true' && 'echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV' || '' }}
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV

    - name: Install Sweep
      shell: bash
      if: ${{ inputs.timestamp == 'true' && github.ref_name == 'develop' }}
      run: cargo install cargo-sweep

    - name: Timestamp Cache
      shell: bash
      if: ${{ inputs.timestamp == 'true' && github.ref_name == 'develop' }}
      run: cargo sweep --stamp
