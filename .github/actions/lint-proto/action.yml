name: "Protolint"
description: "Linter to enforce Protocol Buffer style and conventions"

inputs:
  working-directory:
    description: "the path to where the .proto files are"
    required: false
    default: .

runs:
  using: "docker"
  image: "docker://yoheimuta/protolint:0.58.0"
  args:
    - ${{ inputs.working-directory }}
