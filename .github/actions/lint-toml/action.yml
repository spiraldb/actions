name: Lint TOML
description: "Linter to enforce TOML style and conventions"

runs:
  using: "composite"
  steps:
    - name: Install taplo
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: taplo

    - name: Run taplo-cli
      shell: bash
      run: taplo fmt --check
