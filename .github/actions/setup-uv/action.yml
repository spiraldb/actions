name: "Setup Python UV"
description: "Toolchain setup for Python UV"

inputs:
  sync:
    description: "Sync the project"
    required: false
    default: "true"
  prune-cache:
    description: "Prune cache before save"
    required: false
    default: "true"
  version:
    description: "Version of UV"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.version }}
        enable-cache: true
        prune-cache: ${{ inputs.prune-cache }}
    - name: "Setup up Python"
      shell: bash
      run: uv python install

    - name: Install the project
      if: ${{ inputs.sync == 'true' }}
      shell: bash
      run: uv sync --all-extras --dev -v
      env:
        MATURIN_PEP517_USE_BASE_PYTHON: "true"
        # Keep this constant to avoid pyo3 invalidating itself
        PYO3_ENVIRONMENT_SIGNATURE: "cpython3"

    - name: Export Path
      shell: bash
      run: echo "PATH=$PATH" >> $GITHUB_ENV
